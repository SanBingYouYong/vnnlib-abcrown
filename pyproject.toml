[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vnnlib-abcrown"
dynamic = ["version"]
description = "Use alpha-beta-CROWN as a verification backend for the Vehicle specification language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "onnx", "onnxruntime"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vnnlib-abcrown = "vnnlib_abcrown.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vnnlib_abcrown.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "abcrown: needs alpha-beta-CROWN (and normally a GPU)",
    "vehicle: needs the vehicle executable",
]
